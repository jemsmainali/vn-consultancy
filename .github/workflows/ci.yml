# Runs on every push and pull request: backend tests + migrations, dependency audits, frontend build.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vn_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d vn_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for the disposable CI database only. Never use real secrets in CI.
      DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/vn_ci
      DATABASE_URL_UNPOOLED: postgresql+asyncpg://ci:ci-only-password@localhost:5432/vn_ci
      SECRET_KEY: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System library for python-magic
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pip-audit
      - name: Dependencies are consistent
        run: pip check
      - name: Tests
        run: python -m pytest -q
      - name: Migrations apply to an empty database and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Python dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vn-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: vn-frontend/.node-version
          cache: npm
          cache-dependency-path: vn-frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api
      # Production dependencies only; high/critical fail the build. Build-tool advisories (vite, tailwind)
      # never reach the browser and need major upgrades, so they are reviewed by hand with `npm audit`.
      - name: npm audit (frontend, production dependencies)
        run: npm audit --omit=dev --audit-level=high

  root-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: vn-frontend/.node-version
      - name: npm audit (repository root)
        run: npm audit --omit=dev --audit-level=high
